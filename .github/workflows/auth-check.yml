name: Check sign-in

# Opens the published site in real browsers (desktop Chromium and Firefox, iPhone WebKit,
# Android Chromium), clicks "Continue with Google" and checks that the sign-in window reaches
# Google's account page and that Google's return address is served by this site.
# Runs after every deploy and on manual dispatch. Script: tools/auth-smoke.mjs.
on:
  workflow_run:
    workflows: ["Build and deploy the site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-in:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Playwright's own image has the three browsers and their system libraries built in,
    # so the check does not depend on the runner's Ubuntu version.
    container:
      image: mcr.microsoft.com/playwright:v1.47.2-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install the Playwright library (same version as the image)
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.47.2
      - name: Wait for the deploy to be live
        run: sleep 30
      - name: Run the sign-in checks
        env:
          HOME: /root          # Firefox refuses to start as root with a HOME owned by another user
        run: node tools/auth-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sign-in-screenshots
          path: auth-smoke/
