name: Build and deploy the site

# Builds the homepage, the library (books fetched from their own repositories) and the apps
# (fetched from their own repositories) into _site/, then publishes it with GitHub Pages.
# Pages source must be "GitHub Actions" (Settings → Pages), set once.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"        # every three hours, to pick up new chapters and app versions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: python3 tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the self-hosted sign-in helper is served
        continue-on-error: true
        run: |
          sleep 20
          for u in "/__/auth/handler?apiKey=test&x=1" "/__/auth/iframe?apiKey=test" "/__/auth/handler.js" "/__/firebase/init.json"; do
            echo "== $u"
            curl -s -o /dev/null -L -w 'final=%{url_effective} status=%{http_code} type=%{content_type} redirects=%{num_redirects}\n' "https://jaswin90.github.io$u"
          done
