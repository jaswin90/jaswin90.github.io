name: Apply Google and Firebase settings

# Applies the site's Google Cloud / Firebase settings from this repository, so nobody has to
# change them by hand in the consoles:
#   - enables the APIs the site uses (Drive for the Planner, Analytics for the Admin dashboard);
#   - restricts the browser API key to the site and Firebase's sign-in domain;
#   - publishes firestore.rules (invite-only access) to the Firebase project.
# Runs on manual dispatch and whenever firestore.rules or this file changes.
# Signs in to Google without any stored key (Workload Identity Federation), as the service account
# site-automation, which only this repository's workflows can use. Set up once by running
# `curl -sL jaswin90.github.io/setup.sh | bash` in Google Cloud Shell (tools/gcp-setup.sh).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["firestore.rules", "firebase.json", ".github/workflows/google-setup.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT: jaswin-s-library
      SITE_REFERRERS: "https://jaswin90.github.io/*,https://jaswin-s-library.firebaseapp.com/*,https://jaswin-s-library.web.app/*"
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/240981043036/locations/global/workloadIdentityPools/github/providers/github
          service_account: site-automation@jaswin-s-library.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Enable the APIs the site uses
        run: |
          gcloud services enable --project "$PROJECT" \
            drive.googleapis.com analyticsdata.googleapis.com analyticsadmin.googleapis.com \
            firebaserules.googleapis.com firestore.googleapis.com identitytoolkit.googleapis.com apikeys.googleapis.com
      - name: Restrict the browser API key to the site and Firebase's sign-in domain
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          KEY_STRING=$(printf '%s' "$FIREBASE_CONFIG" | jq -r .apiKey)
          NAME=$(gcloud services api-keys lookup "$KEY_STRING" --project "$PROJECT" --format='value(name)')
          echo "Key: $NAME"
          gcloud services api-keys update "$NAME" --project "$PROJECT" --allowed-referrers="$SITE_REFERRERS"
          gcloud services api-keys describe "$NAME" --project "$PROJECT" --format='yaml(restrictions.browserKeyRestrictions)'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the Firestore rules
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project "$PROJECT" --non-interactive
