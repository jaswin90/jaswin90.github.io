name: Sync books into the library

# Pulls every book listed in library.json from its own repository, adapts it to the
# library (sign-in at /library/ only, links routed through /library/), rebuilds the
# homepage, library and field pages, and commits the result. GitHub Pages then
# publishes the main branch.
on:
  schedule:
    - cron: "17 */3 * * *"        # every three hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["library.json", "tools/**", "library/assets/**", "assets/**", ".github/workflows/sync-books.yml"]

permissions:
  contents: write

concurrency:
  group: sync-books
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync books and rebuild pages
        run: |
          python3 tools/sync_books.py
          python3 tools/build_pages.py
      - name: Commit changes
        run: |
          git config user.name "library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Sync books into the library"
          git push
